# Default Modbus connector configuration installed by the tedge-dot package.
#
# No devices are configured out of the box, so the service starts and stays
# active on a fresh install. Add `[[device]]` sections (see the demo configs in
# /usr/share/tedge-dot/demo/ or the project README) and reload the service:
#
#   sudo systemctl reload tedge-dot

[connector]
protocol      = "modbus"
service_name  = "tedge-dot-modbus"
poll_interval = "2s"
log_level     = "info"

# Liveness (optional, shown with their defaults). A protocol call that never returns — what a
# half-open socket gives you: no answer, no error, no reset — would otherwise block the loop that
# publishes samples, health and link status, leaving the connector silent until it is restarted.
# operation_timeout = "30s"   # bound on one protocol call; a breach is reported as a transport error
# stall_timeout     = "120s"  # restart the connector if its loop stops moving ("0" disables)

[mqtt]
host = "127.0.0.1"
port = 1883

# Shared RTU serial defaults (used when an RTU device omits them).
[connection.serial]
baudrate = 9600
parity   = "N"
stopbits = 2
databits = 8

# Where bare point-library names in `points_from` are looked up (see below).
# Shown with its default; relative entries resolve against this file's directory.
# point_library_path = ["/etc/tedge/plugins/ot/points.d", "/usr/share/tedge-dot/points.d"]

# Add devices below, for example:
#
# [[device]]
# name             = "plc-1"
# protocol_address = { transport = "tcp", host = "127.0.0.1", port = 502, unit_id = 1 }
# poll_interval    = "10s"   # optional: this device's own interval ([connector] poll_interval
#                            # otherwise); a point's poll_interval overrides both
# enabled          = false   # optional: keeps the definition but leaves the device out
#                            # (not connected or polled); default true
#
#   [[device.point]]
#   id       = "boiler_temp"
#   mode     = "typed"
#   datatype = "float32"
#   address  = { table = "holding", address = 7, count = 2 }
#   # Optional human-readable labels. The id stays an identifier (it is a topic
#   # segment); these are what a UI shows instead. Published once in the
#   # connector's retained capability descriptor, not in every sample.
#   name        = "Boiler temp"
#   description = "Outlet temperature after the heat exchanger"
#
# ...or, when several devices share one device type's point list, keep that list
# in a POINT LIBRARY and give the instance only its address:
#
# [[device]]
# name             = "plc-2"
# type             = "acme-meter-v2"   # optional here: the library below declares it
# protocol_address = { transport = "tcp", host = "127.0.0.1", port = 502, unit_id = 2 }
# points_from      = ["acme-meter-v2"]   # points.d/modbus/acme-meter-v2.toml
#
#   # An instance may still add or adjust points without touching the library:
#   # a repeated id patches it, and only the fields named here change.
#   [[device.point]]
#   id   = "boiler_temp"
#   unit = "K"
#
# Libraries live in /etc/tedge/plugins/ot/points.d/<protocol>/ (yours; these
# shadow packaged ones of the same name) or /usr/share/tedge-dot/points.d/<protocol>/
# (shipped by a package). See /usr/share/tedge-dot/points.d/README.md.
