# Default OPC-UA connector configuration installed by the tedge-dot package.
#
# No devices are configured out of the box, so the service starts and stays
# active on a fresh install. Add `[[device]]` sections (see the demo configs in
# /usr/share/tedge-dot/demo/ or the project README) and reload the service:
#
#   sudo systemctl reload tedge-dot

[connector]
protocol      = "opcua"
service_name  = "tedge-dot-opcua"
poll_interval = "2s"
log_level     = "info"

# Liveness (optional, shown with their defaults). A protocol call that never returns — what a
# half-open socket gives you: no answer, no error, no reset — would otherwise block the loop that
# publishes samples, health and link status, leaving the connector silent until it is restarted.
# operation_timeout = "30s"   # bound on one protocol call; a breach is reported as a transport error
# stall_timeout     = "120s"  # restart the connector if its loop stops moving ("0" disables)

[mqtt]
host = "127.0.0.1"
port = 1883

[connection]
application_name  = "tedge-dot"
security_policy   = "None"
security_mode     = "None"
connect_timeout_s = 10

# Add devices below, for example:
#
# [[device]]
# name             = "opc-server-1"
# type             = "acme-plc-v3"   # the device TYPE: names its parameter sets (§5.2)
# protocol_address = { endpoint = "opc.tcp://127.0.0.1:4840/", security_policy = "None", security_mode = "None" }
