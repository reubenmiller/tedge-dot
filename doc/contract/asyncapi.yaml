asyncapi: 3.0.0
info:
  title: thin-edge.io OT Connector Contract
  version: 0.1.0
  description: >
    MQTT interface exposed by a `tedge-dot` instance. A connector publishes
    protocol-neutral "sample" envelopes for the points it reads, advertises its
    capabilities and health, exposes per-device link status, and accepts commands
    (primarily writes) via a retained request/result state machine. thin-edge.io flows
    consume samples and transform them into the standard `te/device/<device>///m|e|a/...`
    data model. See ot-connector-contract.md for the normative description.
  license:
    name: Apache-2.0

defaultContentType: application/json

servers:
  local-broker:
    host: '127.0.0.1:1883'
    protocol: mqtt
    description: The thin-edge.io local MQTT broker (mosquitto).

channels:
  sample:
    address: 'te/device/{device}/ot/{protocol}/sample/{point}'
    description: A single read result for a point. Not retained (time series).
    parameters:
      device: { description: thin-edge device entity id segment, e.g. plc-1 }
      protocol: { description: protocol module id, e.g. modbus }
      point: { description: point id as declared in configuration }
    messages:
      Sample:
        $ref: '#/components/messages/Sample'

  capabilities:
    address: 'te/device/main/service/{service}/ot/capabilities'
    description: Retained capability descriptor published on startup.
    parameters:
      service: { description: connector service name, default tedge-dot }
    messages:
      Capabilities:
        $ref: '#/components/messages/Capabilities'

  health:
    address: 'te/device/main/service/{service}/status/health'
    description: Retained connector service health, per the thin-edge service convention.
    parameters:
      service: { description: connector service name }
    messages:
      Health:
        $ref: '#/components/messages/Health'

  manifest:
    address: 'te/device/{device}/ot/{protocol}/manifest'
    description: >
      Retained per-device manifest (contract §8.2): what the device is and what its points
      are, with their parameter sets resolved. Published before the link status and before
      any sample; cleared when the device is removed or switched off.
    parameters:
      device: { description: thin-edge device entity id segment }
      protocol: { description: protocol module id }
    messages:
      Manifest:
        $ref: '#/components/messages/Manifest'

  link:
    address: 'te/device/{device}/ot/{protocol}/status/link'
    description: Retained per-device link status.
    parameters:
      device: { description: thin-edge device entity id segment }
      protocol: { description: protocol module id }
    messages:
      Link:
        $ref: '#/components/messages/Link'

  command:
    address: 'te/device/{device}///cmd/{commandType}/{id}'
    description: >
      Retained command request/result topic — a thin-edge command topic the connector
      subscribes to and drives itself (contract §6). The requester publishes the 'init'
      message; the connector advances the state machine (executing -> successful|failed) on
      the same topic. Only the instance whose configuration defines the device AND has the
      request's point acts on it; every other instance leaves it unanswered (§6.5). A
      management command type here is claimed by the payload's 'service' field instead (§6.6).
    parameters:
      device: { description: thin-edge device entity id segment }
      commandType: { description: 'thin-edge command type, e.g. ot_write, ot_write_batch' }
      id: { description: unique command instance id }
    messages:
      Command:
        $ref: '#/components/messages/Command'

  commandCapability:
    address: 'te/device/{device}///cmd/{commandType}'
    description: >
      Retained empty object marking that the device answers this command type (contract
      §6.6). Published with the device manifest and cleared with it, so nothing advertises a
      command for a device that is gone.
    parameters:
      device: { description: thin-edge device entity id segment }
      commandType: { description: 'thin-edge command type, e.g. ot_write' }
    messages:
      CommandCapability:
        $ref: '#/components/messages/CommandCapability'

  serviceCommand:
    address: 'te/device/main/service/{service}/cmd/{commandType}/{id}'
    description: >
      Retained request/result topic of the management verbs, addressed to one connector
      instance by its service name (contract §6.3). Same state machine as 'command';
      every transition echoes the request's 'origin'.
    parameters:
      service: { description: connector service name }
      commandType: { description: 'ot_set_config, ot_define_device or ot_remove_device' }
      id: { description: unique command instance id }
    messages:
      Command:
        $ref: '#/components/messages/Command'

operations:
  publishSample:
    action: send
    channel: { $ref: '#/channels/sample' }
    summary: Connector publishes a read result.

  receiveSample:
    action: receive
    channel: { $ref: '#/channels/sample' }
    summary: Flows consume read results and transform them.

  publishCapabilities:
    action: send
    channel: { $ref: '#/channels/capabilities' }
    summary: Connector advertises what it supports.

  publishHealth:
    action: send
    channel: { $ref: '#/channels/health' }
    summary: Connector reports service health.

  publishManifest:
    action: send
    channel: { $ref: '#/channels/manifest' }
    summary: The connector publishes a device's retained manifest.

  publishCommandCapability:
    action: send
    channel: { $ref: '#/channels/commandCapability' }
    summary: The connector marks a command type the device answers.

  publishLink:
    action: send
    channel: { $ref: '#/channels/link' }
    summary: Connector reports per-device link status.

  requestCommand:
    action: receive
    channel: { $ref: '#/channels/command' }
    summary: Connector receives a command 'init' request.

  reportCommand:
    action: send
    channel: { $ref: '#/channels/command' }
    summary: Connector reports command progress and result.

  requestServiceCommand:
    action: receive
    channel: { $ref: '#/channels/serviceCommand' }
    summary: Connector receives a management command 'init' request for its service.

  reportServiceCommand:
    action: send
    channel: { $ref: '#/channels/serviceCommand' }
    summary: Connector reports management command progress and result.

components:
  messages:
    Sample:
      name: Sample
      title: Sample envelope
      contentType: application/json
      payload:
        $ref: './schemas/sample.schema.json'
    Capabilities:
      name: Capabilities
      title: Capability descriptor
      contentType: application/json
      payload:
        $ref: './schemas/status.schema.json#/$defs/capabilities'
    Health:
      name: Health
      title: Service health
      contentType: application/json
      payload:
        $ref: './schemas/status.schema.json#/$defs/health'
    Manifest:
      name: Manifest
      title: Device manifest
      contentType: application/json
      payload:
        $ref: './schemas/manifest.schema.json'
    Link:
      name: Link
      title: Device link status
      contentType: application/json
      payload:
        $ref: './schemas/status.schema.json#/$defs/link'
    CommandCapability:
      name: CommandCapability
      title: Command capability marker
      contentType: application/json
      payload:
        type: object
        description: Always the empty object; the topic carries the meaning.
    Command:
      name: Command
      title: Command request/result
      contentType: application/json
      payload:
        $ref: './schemas/command.schema.json'
