# Connector configuration for the Modbus conformance run.
#
# The harness rewrites [mqtt] and every device protocol_address onto its own test broker and
# simulator before starting the connector, so host/port values here are placeholders.
#
# The point set deliberately exercises every behavioural check:
#   typed decodes across datatypes and word orders (B2), raw mode (B3), a seeded-invalid
#   address (B4), read-only and read-write access (B6/B7), a transform, a bit-field, and a
#   meta echo. Values line up with conformance/seed.json.

[connector]
protocol      = "modbus"
service_name  = "tedge-dot-conformance"
poll_interval = "200ms"
log_level     = "warn"

[mqtt]
host = "127.0.0.1"
port = 1883

[[device]]
name             = "plc1"
# The device type (§3.1): echoed in every sample and on the link status, so the captured
# traffic validates against the schemas with the field present.
type             = "modbus-conformance-sim"
protocol_address = { transport = "tcp", host = "127.0.0.1", port = 502, unit_id = 1 }

  # uint16, read-only (B7 denies writes to it), unit echo. Carries BOTH labels, so
  # the retained device manifest (§8.2) carries them and gets schema-validated here
  # like every other live message class. The three points below cover the three
  # label shapes -- both, name only, description only -- because each is a separate
  # branch in the manifest builder.
  [[device.point]]
  id          = "temp_u16"
  datatype    = "uint16"
  unit        = "counts"
  name        = "Boiler temp"
  description = "Outlet temperature after the heat exchanger"
  address     = { table = "holding", address = 3, count = 1 }

  # uint32 across two registers, big word order. Name only.
  [[device.point]]
  id       = "count_u32"
  datatype = "uint32"
  name     = "Cycle count"
  address  = { table = "holding", address = 4, count = 2 }

  # float32 across two registers; meta is echoed verbatim in every sample.
  # Description only.
  [[device.point]]
  id          = "level_f32"
  datatype    = "float32"
  description = "Level in the buffer tank"
  address     = { table = "holding", address = 6, count = 2 }
  meta        = { on_change = true, deadband = 0.5 }

  # linear transform applied after decode: 250 / 10 = 25.
  [[device.point]]
  id        = "scaled"
  datatype  = "uint16"
  address   = { table = "holding", address = 8, count = 1 }
  transform = { divisor = 10 }

  # bit-field extraction: register 0x01e0, bits 5..9 -> 15.
  [[device.point]]
  id       = "status_bits"
  datatype = "uint16"
  address  = { table = "holding", address = 9, count = 1, start_bit = 5, bit_count = 4 }

  # `bytes` is the raw case (§1): the value is the hex of the registers read, and B3 keys on
  # `datatypes` containing `bytes` where it used to key on `modes` containing `raw`.
  [[device.point]]
  id       = "raw_regs"
  datatype = "bytes"
  address  = { table = "holding", address = 6, count = 2 }

  # reading this address raises a Modbus exception -> quality "bad" (B4).
  [[device.point]]
  id       = "bad_point"
  datatype = "uint16"
  address  = { table = "holding", address = 1, count = 1 }

  # writable register points (B6 write round-trips).
  [[device.point]]
  id       = "setpoint_u16"
  datatype = "uint16"
  access   = "read_write"
  address  = { table = "holding", address = 20, count = 1 }

  [[device.point]]
  id       = "setpoint_f32"
  datatype = "float32"
  access   = "read_write"
  address  = { table = "holding", address = 22, count = 2 }

  # Writable AND transformed: the round trip §4.2 exists for. A write carries engineering
  # units, so the runtime must invert `decimal_shift = -3` before the module encodes the
  # register — write 12.345 and the register holds 12345, not 12. Without a point that is both
  # writable and scaled, the 0.1 defect (writes encoded verbatim) passed every suite.
  [[device.point]]
  id        = "setpoint_scaled"
  datatype  = "uint16"
  access    = "read_write"
  address   = { table = "holding", address = 24, count = 1 }
  transform = { decimal_shift = -3 }
  unit      = "kV"

  # Typed signal metadata (§5): `range` is enforced on write by the runtime, `publish` is
  # applied by the runtime to this point's sample stream, and both must appear on the device
  # manifest (B1-manifest) so a consumer sees the limits and the policy that produced the
  # stream. B7-range writes outside these bounds and requires a failure with nothing applied.
  [[device.point]]
  id        = "bounded_u16"
  datatype  = "uint16"
  access    = "read_write"
  address   = { table = "holding", address = 26, count = 1 }
  range     = { min = 10, max = 500 }
  publish   = { on_change = true, min_interval = "1s" }
  measurement = { group = "Conformance", series = "Bounded" }
  meta      = { asset_tag = "B-17" }

  # writable coil (B6 boolean round-trip).
  [[device.point]]
  id       = "coil_rw"
  datatype = "bool"
  access   = "read_write"
  address  = { table = "coil", address = 48, count = 1 }

  # discrete input read as boolean.
  [[device.point]]
  id       = "door_contact"
  datatype = "bool"
  address  = { table = "discrete_input", address = 10, count = 1 }

  # int64 across four registers (2^40, inside the JS safe-integer range).
  [[device.point]]
  id       = "big_i64"
  datatype = "int64"
  address  = { table = "holding", address = 30, count = 4 }

  # float64 across four registers (3.14159).
  [[device.point]]
  id       = "pi_f64"
  datatype = "float64"
  address  = { table = "holding", address = 34, count = 4 }

  # float32 with little word order (registers swapped in the seed).
  [[device.point]]
  id         = "swapped_f32"
  datatype   = "float32"
  word_order = "little"
  address    = { table = "holding", address = 38, count = 2 }
