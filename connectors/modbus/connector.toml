# Modbus connector configuration for the end-to-end test harness.
#
# Points map onto the values baked into the pymodbus simulator
# (see sim/modbus.json). With "shared blocks": true the holding,
# input and coil tables share one address space, so the holding-register
# addresses below read the simulator's seeded values:
#
#   holding 3      -> uint16  17001
#   holding 4..5   -> uint32  617001
#   holding 6..7   -> float32 404.17
#   coil    48     -> bool    false (initially)
#   holding 1      -> flagged "invalid" -> read raises a Modbus exception
#
# Decode defaults are big-endian / big word-order, which matches the simulator.
#
# `count_u32` and `level_f32` are NOT defined here: they come from the point
# library points.d/modbus/plc-sim.toml (contract §3.4), which the connector
# image installs at /usr/share/tedge-dot/points.d/. Keeping half the points in
# a library and half inline makes every existing assertion in the suite double
# as a check that a referenced point behaves identically to an inline one.

[connector]
protocol      = "modbus"
service_name  = "tedge-dot"
poll_interval = "1s"
log_level     = "info"
# `c8y_SetCoil` needs a Cumulocity operation of its own — two templates cannot share one
# `workflow.operation` — so it gets a command type of its own, aliased onto the write verb the
# connector already implements (contract §6.6). Delete this when c8y_SetCoil goes.
command_aliases = { ot_write_coil = "ot_write" }

[mqtt]
host = "broker"
port = 1883

[[device]]
name             = "plc1"
protocol_address = { transport = "tcp", host = "simulator", port = 502, unit_id = 1 }
points_from      = ["plc-sim", "./points.d/modbus/plc-sim-extra.toml"]
# ^ one library by NAME (resolved along the search path, where the image installs
#   points.d as a package would) and one by relative PATH (resolved against this
#   file's own directory, which is why the image also places points.d next to it).
#   Both forms are legal in a config file, and the path form must not stop the
#   management verbs from working (§3.4/§6.3) — the define-device test depends on it.

  # uint16 holding register (also used for the register write round-trip).
  [[device.point]]
  id       = "temp_u16"
  datatype = "uint16"
  access   = "read_write"
  address  = { table = "holding", address = 3, count = 1 }

  # Override one field of a point the library provides, without restating its
  # datatype or address: the resolved point must keep those and take this unit.
  [[device.point]]
  id   = "level_f32"
  unit = "m"

  # Reading this address makes the simulator return an exception -> quality "bad".
  [[device.point]]
  id       = "bad_point"
  datatype = "uint16"
  address  = { table = "holding", address = 1, count = 1 }

  # Coil used for the boolean write round-trip.
  [[device.point]]
  id       = "coil_rw"
  datatype = "bool"
  access   = "read_write"
  address  = { table = "coil", address = 48, count = 1 }

  # A parameter kept off the measurements (`measurement = false`): sampled, and on the
  # parameter twin fragment like temp_u16 (it reads the same register), but never published as a
  # measurement series by ot-measurement.
  [[device.point]]
  id       = "twin_only_u16"
  datatype = "uint16"
  access   = "read_write"
  address  = { table = "holding", address = 3, count = 1 }
  measurement = false

  # Writable AND scaled: a write carries engineering units and the runtime inverts the
  # transform before the module encodes the register (§4.2). Register 3 holds 17001, so this
  # reads 17.001; writing 20 must leave 20000 in the register, and the next read must say 20 —
  # the round trip the 0.1 connector broke by encoding the request value verbatim.
  [[device.point]]
  id        = "temp_scaled"
  datatype  = "uint16"
  access    = "read_write"
  address   = { table = "holding", address = 3, count = 1 }
  transform = { decimal_shift = -3 }
  unit      = "kV"

  # Typed signal metadata (§5). `range` is enforced on WRITE by the runtime, in engineering
  # units, before the device is touched — the limit a cloud form renders is now the limit a
  # script meets too. `meta` is what it always was: the site's own tags, untouched.
  #
  # Deliberately NO `publish` here: this point is polled and asserted on repeatedly, and a
  # publish policy would (correctly) suppress the repeats. `quiet_u16` below covers that.
  [[device.point]]
  id          = "bounded_u16"
  datatype    = "uint16"
  access      = "read_write"
  address     = { table = "holding", address = 52, count = 1 }
  range       = { min = 10, max = 500 }
  measurement = { group = "Plant", series = "Bounded" }
  meta        = { asset_tag = "B-17" }

  # `publish` (§5.4) applied by the RUNTIME, not by a flow. Writable so the suite can make the
  # value change on demand: `on_change` must let that one change through and then suppress
  # every identical re-read, while the points around it keep publishing every poll. Waiting
  # for the value to change is what makes the test deterministic — a point that only ever
  # publishes once, at startup, races the test client's subscription.
  [[device.point]]
  id       = "quiet_u16"
  datatype = "uint16"
  access   = "read_write"
  address  = { table = "holding", address = 54, count = 1 }
  publish  = { on_change = true }

# Switched off (§3.3): a disabled device is not loaded at all — never connected, polled or
# advertised — and nothing else about it is read, so the point library it names need not be
# installed. This one does not exist: remove `enabled = false` and the config no longer loads.
[[device]]
name             = "plc-off"
protocol_address = { transport = "tcp", host = "simulator", port = 502, unit_id = 1 }
points_from      = ["not-installed-pack"]
enabled          = false
