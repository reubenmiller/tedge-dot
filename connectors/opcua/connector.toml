# OPC-UA connector configuration for the end-to-end test harness.
#
# Points map onto the nodes exposed by the asyncua simulator (see simulator/server.py),
# addressed by stable string NodeIds under namespace index 2:
#
#   ns=2;s=Temperature   -> float64 21.5
#   ns=2;s=Count         -> uint32  617001
#   ns=2;s=Setpoint      -> int32   0      (read/write round-trip)
#   ns=2;s=Running       -> bool    false  (read/write round-trip)
#   ns=2;s=DoesNotExist  -> read returns a Bad status -> quality "bad"
#   ns=2;s=Ticks         -> uint32, +1 every second -> push delivery via subscription

[connector]
protocol      = "opcua"
service_name  = "tedge-dot"
poll_interval = "1s"
log_level     = "info"
# Bounds one protocol call (contract §8.1). Lowered from the 30s default so the suite's
# subscription-inactivity test does not have to wait a full minute for the keep-alive window
# to lapse — see "Push Delivery Recovers From A Silent Server" in tests/opcua_e2e.robot.
operation_timeout = "5s"

[mqtt]
host = "broker"
port = 1883

[connection]
application_name = "tedge-dot"
security_policy  = "None"
security_mode    = "none"

[[device]]
name             = "opc1"
# The device type (§3.1), declared on the device itself here -- the Modbus harness inherits
# its type from a point library instead, so the pair covers both halves of the rule. It names
# the device's parameter sets (opcua_sim_control_parameters) and its thin-edge entity type.
type             = "opcua-sim"
protocol_address = { endpoint = "opc.tcp://simulator:4840/", security_policy = "None", security_mode = "none" }
default_mode     = "typed"

  [[device.point]]
  id       = "temperature"
  subscribe = false
  datatype = "float64"
  unit     = "°C"
  address  = { node_id = "ns=2;s=Temperature" }

  [[device.point]]
  id       = "count_u32"
  subscribe = false
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Count" }

  # Int32 used for the numeric write round-trip.
  [[device.point]]
  id       = "setpoint"
  subscribe = false
  datatype = "int32"
  access   = "read_write"
  address  = { node_id = "ns=2;s=Setpoint" }

  # Boolean used for the boolean write round-trip. It also declares an alarm (standing while the
  # value is true: no `when`) and an event (on every change), which the ot-alarm / ot-event flows
  # raise from its samples alone.
  [[device.point]]
  id       = "running"
  subscribe = false
  datatype = "bool"
  access   = "read_write"
  address  = { node_id = "ns=2;s=Running" }
  meta     = { alarm = { type = "running_alarm", severity = "minor", text = "{point} is {value}" }, event = { type = "running_changed", text = "Running changed to {value}" } }

  # Reading this node returns a Bad status -> quality "bad".
  [[device.point]]
  id       = "bad_point"
  subscribe = false
  datatype = "uint16"
  address  = { node_id = "ns=2;s=DoesNotExist" }

  # Incremented every second by the simulator; delivered via OPC-UA subscription
  # (monitored item) rather than polling — the other points opt out with subscribe = false
  # (static nodes only notify once, and bad_point would reject the device subscription).
  # The free-form meta table is echoed verbatim in every sample envelope.
  [[device.point]]
  id       = "ticks"
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Ticks" }
  meta     = { on_change = true, source = "sim" }

  # Subscribed, but pointing at the STATIC Temperature node, and it exists purely to make the
  # push tests discriminating.
  #
  # A subscription reports value CHANGES, so this point publishes its initial value once and
  # then goes quiet. Polling would republish it every poll_interval whether or not anything
  # changed. That silence is the one thing polling cannot imitate -- and it is the only usable
  # discriminator, because a RATE check cannot tell the two apart: the runtime hands the
  # connector each point's resolved poll interval as the monitored item's sampling interval, so
  # push and polling deliver at the same rate by design. See
  # "Subscribed Static Node Falls Silent After Its First Value" in tests/opcua_e2e.robot.
  [[device.point]]
  id       = "temperature_pushed"
  datatype = "float64"
  unit     = "°C"
  address  = { node_id = "ns=2;s=Temperature" }

  # The Count node again, as a read-only parameter that names its own key in its set: the
  # `counters` twin fragment carries it as `count`, not as its id, and the capability descriptor
  # lists the key (parameter_keys, §7) so the flows know it before the point samples. Last on
  # purpose: `describe` renders sets in the order they first appear, and the describe test reads
  # the first one.
  [[device.point]]
  id       = "cycle_count"
  subscribe = false
  datatype = "uint32"
  address  = { node_id = "ns=2;s=Count" }
  meta     = { parameter = { set = "counters", key = "count" }, measurement = false }
