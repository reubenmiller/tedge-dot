# ot-registration: connector link status -> thin-edge child-device registration
# The device manifest (contract §8.2) carries the connector's device descriptor (`info`) for the
# optional twin fragment; the link status carries the device `type` and triggers registration.
input.mqtt.topics = ["te/+/+/ot/+/status/link", "te/+/+/ot/+/manifest"]

[config]
# thin-edge entity type assigned to registered OT devices that do not declare one. A connector
# whose device config names a `type` (contract §3.1) reports it on the link status, and that
# wins over this — it says what the device *is* rather than which protocol reaches it.
device_type = "${params.device_type}"
# Extra command capabilities to advertise on each device, beyond the ones the device manifest
# lists (the connector already answers those). `parameter_update` is the one that belongs here:
# no connector answers it — ot-parameter-update bridges it to an ot_write_batch.
command_capabilities = "${params.command_capabilities}"
# Optional digital-twin fragment name. When set, the connector's device descriptor (the device
# manifest's `info`) is published to te/device/<device>///twin/<twin_fragment>. Empty = no twin.
twin_fragment = "${params.twin_fragment}"

[[steps]]
script = "main.js"
