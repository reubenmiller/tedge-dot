# ot-parameter-state: connector samples + write results -> device twin (parameter sets)
#
# Maintains one twin fragment per parameter set (te/device/<device>///twin/<set>) holding the
# current value of every parameter (writable point) of the device, so a cloud UI such as
# Cumulocity's device "Parameters" tab shows the live state.
input.mqtt.topics = [
  # The retained device manifest (contract §8.2) says which points are parameters and which
  # sets they belong to, resolved by the connector. Brokers do not guarantee delivery order
  # across topic filters after a restart, so a sample or write result seen before its device's
  # manifest is simply left for the next one.
  "te/+/+/ot/+/manifest",
  "te/+/+/ot/+/sample/+",
  # Write results now arrive on the thin-edge command topics the connector answers on
  # directly (contract §6.6, RFC 0006 §7) — there is no connector-side command topic left.
  "te/+/+/+/+/cmd/ot_write/+",
  "te/+/+/+/+/cmd/ot_write_batch/+",
]

[config]
# One parameter set for every parameter, instead of the sets the connector resolved on the
# manifest ("<device type, else protocol>_<group>_parameters"). Empty -> the manifest's.
default_set = "${params.default_set}"

[[steps]]
script = "main.js"
