# ot-parameter-state: connector samples + write results -> device twin (parameter sets)
#
# Maintains one twin fragment per parameter set (te/device/<device>///twin/<set>) holding the
# current value of every parameter (writable point) of the device, so a cloud UI such as
# Cumulocity's device "Parameters" tab shows the live state.
input.mqtt.topics = [
  # First, because it is retained and carries the device type: on a (re)start the type is then
  # usually known before a replayed sample or write result is attributed to a set. Brokers do
  # not guarantee delivery order across topic filters, so this is a nicety, not the guard — the
  # guard is that samples carry the type themselves and a requested write carries `origin.set`.
  # It is also the only source of the type for a device whose parameters are all write-only,
  # since those points never produce a sample.
  "te/+/+/ot/+/status/link",
  # Retained: the points that name their own key in a set (parameter_keys, contract §7), so a
  # key is known before the point samples — after a restart, and for write-only points.
  "te/device/main/service/+/ot/capabilities",
  "te/+/+/ot/+/sample/+",
  "te/+/+/ot/+/cmd/write/+",
  "te/+/+/ot/+/cmd/write-batch/+",
]

[config]
# One parameter set for every point that does not name an absolute one, instead of the derived
# "<device type, else protocol>_<group>_parameters". Empty -> derive.
default_set = "${params.default_set}"

[[steps]]
script = "main.js"
