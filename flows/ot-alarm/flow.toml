# ot-alarm: OT signal -> thin-edge alarm (retained; raised and cleared)
#
# Two independent sources, see main.js:
#   * per-signal alarms declared on a connector point's `meta.alarm`, evaluated on its samples
#     for any value (number, boolean, string). Inert without a declaration, so the flow ships
#     active;
#   * one measurement series with a threshold and hysteresis (the config below). Off while
#     params.series is empty.
# The companion flow alarm-state.toml records which alarms are standing, so a restart does not
# raise a still-retained alarm again.
input.mqtt.topics = [
  "te/+/+/ot/+/sample/+",
  # Retained, and republished on every configuration change: clears the alarms of removed points.
  "te/+/+/ot/+/status/link",
  # Matches any measurement group (m/<group>); the monitored group is taken from the topic
  # unless overridden by params.group.
  "te/+/+/+/+/m/+",
]

[config]
# Series within the measurement to monitor: payload[group][series]. Empty series = off.
group      = "${params.group}"
series     = "${params.series}"
# Raise at/above threshold; clear only below (threshold - hysteresis).
threshold  = "${params.threshold}"
hysteresis = "${params.hysteresis}"
severity   = "${params.severity}"
alarm_type = "${params.alarm_type}"
text       = "${params.text}"

[[steps]]
script = "main.js"
