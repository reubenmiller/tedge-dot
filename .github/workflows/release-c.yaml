name: Release (C PoC)

# Build, test and release the C proof-of-concept build (poc-c/).
#
# Every architecture is cross-compiled with zig on a single runner, inside the
# Debian multiarch image in poc-c/cross/: zig supplies the compiler and libc,
# Debian supplies the target-architecture shared libraries. Besides collapsing
# the old per-architecture native runners into one job, this lets us pin the
# minimum glibc (2.17 -- RHEL 7 / Debian 8 era), which a native build cannot:
# an ubuntu-24.04 build hard-requires glibc 2.39 on the target.
#
#   * push a tag matching c-v*  -> GitHub pre-release with deb/rpm/apk + tarballs
#     (release.yaml ignores c-v* tags, so a C tag does not trigger the Rust
#     release);
#   * run manually (workflow_dispatch) -> refreshes the rolling `c-snapshot`
#     pre-release so the latest build is always one download away, unless
#     publish_snapshot is turned off (then the artifacts stay on the run).

on:
  push:
    tags: ["c-v*"]
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: "Refresh the rolling c-snapshot pre-release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  # Debian architectures to build, and the oldest glibc the binaries must run on.
  ARCHS: "amd64 arm64 armhf"
  GLIBC_MIN: "2.17"

jobs:
  build:
    name: Cross-build, verify & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Needed to *run* the arm64/armhf binaries in the verify step below.
      - uses: docker/setup-qemu-action@v3

      - name: Build the cross-compilation image
        run: docker build -t tedge-dot-cross poc-c/cross

      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            v="${{ github.ref_name }}"; v="${v#c-v}"; v="${v#v}"
          else
            v="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Packaging version $v"

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Cross-build every architecture
        run: |
          set -eux
          for arch in $ARCHS; do
            mkdir -p "poc-c/dist/$arch"
            docker run --rm \
              -v "$PWD:/src:ro" -v "$PWD/poc-c/dist/$arch:/out" \
              -e ARCH="$arch" -e GLIBC_MIN="$GLIBC_MIN" \
              tedge-dot-cross
          done

      - name: Verify on an old distro (golden vectors, glibc floor)
        run: |
          set -eux
          for arch in $ARCHS; do
            case "$arch" in
              armhf) platform=linux/arm/v7 ;;
              *)     platform="linux/$arch" ;;
            esac
            docker run --rm --platform "$platform" \
              -v "$PWD/poc-c/dist/$arch:/out" \
              -v "$PWD:/src:ro" \
              -v "$PWD/poc-c/cross/verify.sh:/verify.sh:ro" \
              public.ecr.aws/docker/library/debian:bullseye-slim /verify.sh
          done

      - name: Package (deb / rpm / apk + tarball)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -eux
          mkdir -p dist poc-c/dist/staged
          for arch in $ARCHS; do
            # nfpm expands env vars in scalar fields but not in contents[].src,
            # so stage this architecture's binary where nfpm.yaml points.
            cp "poc-c/dist/$arch/tedge-dot" poc-c/dist/staged/tedge-dot
            case "$arch" in
              armhf) export ARCH=arm7 ;;
              *)     export ARCH="$arch" ;;
            esac
            for format in deb rpm apk; do
              nfpm pkg -f poc-c/packaging/nfpm.yaml -p "$format" -t dist/
            done

            staging="tedge-dot-c_${VERSION}_linux_${arch}"
            mkdir -p "pkgroot/$staging"
            cp "poc-c/dist/$arch/tedge-dot" "pkgroot/$staging/"
            cp poc-c/README.md "pkgroot/$staging/"
            cp -r poc-c/packaging/config "pkgroot/$staging/config-defaults"
            tar -czf "dist/${staging}.tar.gz" -C pkgroot "$staging"
          done
          ( cd dist && sha256sum ./* > ../SHA256SUMS.tmp && mv ../SHA256SUMS.tmp SHA256SUMS )
          ls -l dist

      - name: Package smoke (inspect, install, run)
        run: |
          deb=$(ls dist/*_amd64.deb)
          echo "== control metadata =="
          dpkg-deb -I "$deb" | grep -E 'Package:|Version:|Architecture:|Depends:|Conflicts:|Provides:'
          # A real thin-edge host already has the tedge user; create it so the
          # package's tedge-owned config files and service user resolve cleanly.
          sudo groupadd --system tedge 2>/dev/null || true
          sudo useradd --system --gid tedge --no-create-home --shell /usr/sbin/nologin tedge 2>/dev/null || true
          sudo apt-get install -y "./$deb"
          echo "== packaged binary runs =="
          command -v tedge-dot
          tedge-dot run /nonexistent 2>&1 | head -1 || true

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish pre-release
    needs: build
    if: github.ref_type == 'tag' || inputs.publish_snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Resolve release tag
        id: rel
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "title=tedge-dot C PoC ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=c-snapshot" >> "$GITHUB_OUTPUT"
            echo "title=tedge-dot C PoC (rolling snapshot)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rel.outputs.tag }}
          TITLE: ${{ steps.rel.outputs.title }}
        run: |
          set -eux
          ls -l dist
          # The snapshot tag is rolling: replace the previous release and tag.
          if [ "$TAG" = "c-snapshot" ]; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --prerelease \
            --notes-file poc-c/packaging/release-notes.md
