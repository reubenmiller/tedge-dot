name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust build & unit/property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (libudev for the profibus serial transport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      # The cargo workspace lives in impl/rust/; go through `just` so CI and a local run
      # use exactly the same --manifest-path.
      - uses: extractions/setup-just@v2
      - name: Build
        run: cargo build --manifest-path impl/rust/Cargo.toml --workspace
      - name: Unit + integration + property tests
        run: just test
      - name: Clippy
        run: just lint

  # Cheap guard on the parity mechanism itself: a mistyped `requires:` tag is never skipped,
  # and a capability nothing is tagged with makes the skip a no-op.
  capability-tags:
    name: Capability tag consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just check-capability-tags

  # The two packages are meant to be interchangeable, so they must install the same files.
  # Nothing enforced that, and point libraries went into one manifest twice running.
  packaging-parity:
    name: Packaging manifest parity
    runs-on: ubuntu-latest
    # Frozen with the C build (RFC 0006 §9): the tedge-dot-c manifest stays at 0.1 while the
    # Rust package follows the 0.2 flows and configs, so the two are not expected to match
    # until the C port lands. Re-enable together with the `c` job.
    if: false
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - run: just check-manifest-parity

  flows:
    name: Flow tests (tedge flows test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install thin-edge.io
        run: curl -fsSL https://thin-edge.io/install.sh | sh -s
      - name: Run flow tests
        run: ./flows/test-flows.sh

  fuzz-smoke:
    name: Fuzz smoke (30s per target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust/crates/sdk/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz all targets briefly
        working-directory: impl/rust/crates/sdk
        run: |
          for t in decode_primitive config_toml transform sample_envelope; do
            cargo +nightly fuzz run "$t" -- -max_total_time=30
          done

  c:
    name: C build & conformance (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    # Contract 0.2 transition (RFC 0006 §9, option A): the C implementation is frozen at
    # contract 0.1, whole, until 0.2 is ratified and shipped in Rust. The shared suites move to
    # 0.2 with the Rust build, so this job would only report the freeze as a failure. It is
    # gated rather than deleted: flip the condition back when the C port lands.
    if: false
    strategy:
      fail-fast: false
      matrix:
        protocol: [modbus, opcua, canbus, canopen, profibus]
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install C toolchain + libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config \
            libmodbus-dev libmosquitto-dev libcjson-dev \
            mosquitto mosquitto-clients jq
          # open62541 is built from source by CMake (FetchContent) when no
          # distro package is found, so it is deliberately not installed here.
      - name: Load vcan kernel module (SocketCAN suites)
        if: matrix.protocol == 'canbus' || matrix.protocol == 'canopen'
        run: |
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe vcan
      - name: Build
        run: |
          cmake -B impl/c/build -S impl/c -G Ninja
          cmake --build impl/c/build
      - name: Golden decode vectors (shared with the Rust SDK)
        run: ctest --test-dir impl/c/build --output-on-failure
      - name: Start MQTT broker
        run: |
          sudo systemctl start mosquitto || mosquitto -d -p 1883
          timeout 10 sh -c 'until nc -z 127.0.0.1 1883; do sleep 0.5; done'
      # `just sim` pins the host port the demo configs (and smoke.sh) expect; the e2e stacks
      # leave it ephemeral so they stay parallel-safe.
      - name: Start protocol simulator
        run: just sim ${{ matrix.protocol }}
      - name: Smoke test against simulator + broker
        run: ./impl/c/ci/smoke.sh ${{ matrix.protocol }}
      # The contract conformance suite (layers 1-3) against the C build, for the protocols the
      # harness has a built-in simulator for. Same checks as the Rust `conformance` job.
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.protocol == 'modbus' || matrix.protocol == 'opcua'
      - uses: Swatinem/rust-cache@v2
        if: matrix.protocol == 'modbus' || matrix.protocol == 'opcua'
        with:
          workspaces: impl/rust
      - name: Conformance suite against the C build
        if: matrix.protocol == 'modbus' || matrix.protocol == 'opcua'
        run: just conformance-c ${{ matrix.protocol }}
      # `tedge-dot describe` must render the same Cumulocity DTM definitions in both builds;
      # runs once (it covers every config in the repo) where the Rust toolchain is set up.
      - name: Describe parity (Rust vs C)
        if: matrix.protocol == 'modbus'
        run: just c-describe-parity
      - name: Connector log + simulator log on failure
        if: failure()
        run: docker compose -p tedge-dot-sim-${{ matrix.protocol }} -f connectors/${{ matrix.protocol }}/docker-compose.yaml logs simulator || true

  conformance:
    name: Conformance (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        protocol: [modbus, opcua, canbus, canopen, profibus]
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (libudev for the profibus serial transport)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: impl/rust
      - uses: extractions/setup-just@v2
      - name: Run conformance suite
        run: just conformance ${{ matrix.protocol }}

  e2e:
    name: e2e (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Capped so fewer stacks pull the broker image at the same moment. The pre-pull in the
      # `_e2e` recipe already retries a throttled pull, and GitHub runners share their egress IP
      # with every other Actions user, so this only thins out our own share of the traffic —
      # but between the two, `toomanyrequests: Rate exceeded` stops failing whole runs. Each
      # matrix runs in two waves of jobs that take 1-3 minutes, so the cost is small.
      max-parallel: 3
      matrix:
        protocol: [modbus, opcua, canbus, canopen, profibus]
    steps:
      - uses: actions/checkout@v4
      - name: Load vcan kernel module (SocketCAN suites)
        if: matrix.protocol == 'canbus' || matrix.protocol == 'canopen'
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe vcan
      - uses: extractions/setup-just@v2
      - name: Run e2e suite
        run: just test-e2e ${{ matrix.protocol }}
      - name: Upload robot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-output-${{ matrix.protocol }}
          path: connectors/${{ matrix.protocol }}/output/
          if-no-files-found: ignore

  e2e-c:
    name: e2e, C connector (${{ matrix.protocol }})
    runs-on: ubuntu-latest
    # Contract 0.2 transition (RFC 0006 §9, option A): the C implementation is frozen at
    # contract 0.1, whole, until 0.2 is ratified and shipped in Rust. The shared suites move to
    # 0.2 with the Rust build, so this job would only report the freeze as a failure. It is
    # gated rather than deleted: flip the condition back when the C port lands.
    if: false
    strategy:
      fail-fast: false
      # Capped so fewer stacks pull the broker image at the same moment. The pre-pull in the
      # `_e2e` recipe already retries a throttled pull, and GitHub runners share their egress IP
      # with every other Actions user, so this only thins out our own share of the traffic —
      # but between the two, `toomanyrequests: Rate exceeded` stops failing whole runs. Each
      # matrix runs in two waves of jobs that take 1-3 minutes, so the cost is small.
      max-parallel: 3
      matrix:
        protocol: [modbus, opcua, canbus, canopen, profibus]
    steps:
      - uses: actions/checkout@v4
      - name: Load vcan kernel module (SocketCAN suites)
        if: matrix.protocol == 'canbus' || matrix.protocol == 'canopen'
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r)
          sudo modprobe vcan
      - uses: extractions/setup-just@v2
      - name: Run e2e suite against the C connector
        run: just test-e2e-c ${{ matrix.protocol }}
      - name: Upload robot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-output-c-${{ matrix.protocol }}
          path: connectors/${{ matrix.protocol }}/output-c/
          if-no-files-found: ignore
