name: Cloud e2e (Cumulocity)

# Tenant-gated: runs the full Cumulocity end-to-end suite (child registration, twin,
# measurements, c8y_SetRegister/c8y_SetCoil, and the Cloud Fieldbus round-trip) against a
# live tenant. Manual trigger only — requires the repository secrets
# C8Y_BASEURL / C8Y_USER / C8Y_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      protocol:
        description: Protocol harness under cloud/
        default: modbus
        required: true
      impl:
        description: Connector implementation under test
        type: choice
        options: [rust, c]
        default: rust
        required: true

concurrency:
  group: cloud-e2e
  cancel-in-progress: false

permissions:
  contents: read

# The suites generate their own device id per run (DeviceLibrary, "TST_*") and delete the
# device and its user at teardown, so no DEVICE_ID is configured here and no cleanup step is
# needed on the happy path — the one below only catches runs that crashed before teardown.
#
# NOTE: the `env:` key below is load-bearing. Without it these three lines parse as extra
# members of `concurrency:` and the credentials never reach the job at all.
env:
  C8Y_BASEURL: ${{ secrets.C8Y_BASEURL }}
  C8Y_USER: ${{ secrets.C8Y_USER }}
  C8Y_PASSWORD: ${{ secrets.C8Y_PASSWORD }}
  # The fourth one every consumer of the harness expects (cloud/_shared/device.resource,
  # FieldbusLibrary, ParameterLibrary, and the cleanup step below). Optional only if
  # C8Y_USER is stored as `tenant/user`.
  C8Y_TENANT: ${{ secrets.C8Y_TENANT }}

jobs:
  cloud-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2

      # Only the Rust image installs a package; the C image compiles impl/c/ in a build stage.
      - name: Build connector package (.deb)
        if: inputs.impl == 'rust'
        run: |
          docker build -f Dockerfile.package --build-arg PKG_ARCH=amd64 --target export --output dist .
          mv dist/tedge-dot.deb dist/tedge-dot-rs_0.0.0-ci_linux_amd64.deb

      - name: Run cloud e2e suite (${{ inputs.impl }})
        run: |
          if [ "${{ inputs.impl }}" = "c" ]; then
            just test-cloud-c ${{ inputs.protocol }}
          else
            just test-cloud ${{ inputs.protocol }}
          fi

      - name: Upload robot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-output-cloud-${{ inputs.protocol }}-${{ inputs.impl }}
          path: cloud/${{ inputs.protocol }}/output*/
          if-no-files-found: ignore

      - name: Install go-c8y-cli
        if: always()
        uses: reubenmiller/setup-go-c8y-cli@main
      - name: Clean up tenant leftovers (runs that crashed before their teardown)
        if: always()
        env:
          C8Y_HOST: ${{ secrets.C8Y_BASEURL }}
          C8Y_USERNAME: ${{ secrets.C8Y_USER }}
          C8Y_SETTINGS_CI: "true"
        run: just cleanup "TST_*" || true
