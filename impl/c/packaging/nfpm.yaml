# nfpm configuration for the C implementation of tedge-dot (impl/c/).
# Docs: https://nfpm.goreleaser.com
#
# Run once per architecture by .github/workflows/release.yaml (and by
# `just c-package`) with ARCH and VERSION set in the env. nfpm expands env vars
# in scalar fields like `arch:` but NOT in `contents[].src`, so the binary for
# the architecture being packaged is staged into impl/c/dist/staged/ first --
# a dedicated path rather than impl/c/build/, so a cross-package run can never
# silently pick up a stale native build. See impl/c/cross/ for the builds.
#
# The package is interchangeable with the Rust one (`tedge-dot-rs`, built by
# .goreleaser.yaml): same /usr/bin/tedge-dot, same systemd unit, same
# /etc/tedge/plugins/ot/ layout and the same connector contract — so the two are
# mutually exclusive and only one can be installed at a time. This one
# additionally ships the PROFIBUS connector, which the Rust package omits
# because its serial dependency does not cross-compile (see TODO.md).

name: tedge-dot-c
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: semver
section: default
priority: extra
maintainer: thin-edge.io <info@thin-edge.io>
description: |
  thin-edge.io OT protocol connectors - C implementation.
  Modbus, OPC UA, CAN bus, CANopen and PROFIBUS-DP in one small native binary.
homepage: https://github.com/thin-edge/tedge-dot
license: Apache-2.0

# Interchangeable with the Rust package: same files, so the two cannot coexist.
# Both Provide the `tedge-dot` virtual package and Conflict with it, which makes
# them mutually exclusive (a conflict against a virtual package also conflicts
# with everything else providing it); `tedge-dot-rs` is named explicitly too.
# Replacing `tedge-dot` upgrades installs made before the package split.
provides:
  - tedge-dot
conflicts:
  - tedge-dot
  - tedge-dot-rs
replaces:
  - tedge-dot

# The connectors dynamically link these; open62541 is statically linked, so it
# is not a runtime dependency. Package names are Debian/Ubuntu; the rpm/apk
# overrides use each ecosystem's names (best effort — adjust per distro).
#
# tedge-parameter-plugin owns the c8y_ParameterUpdate operation template that the
# ot-command-forward flow serves for the OT child devices, so writing points from
# the Cumulocity Parameters tab works out of the box
# (doc/rfc/0003-parameter-writes.md). It is published to the same thin-edge
# community repository as this package, under the same name for every format.
# An override REPLACES the base list, so it is repeated in each. Keep in step
# with .goreleaser.yaml.
depends:
  - libmodbus5
  - libmosquitto1
  - libcjson1
  - tedge-parameter-plugin
overrides:
  rpm:
    depends:
      - libmodbus
      - mosquitto
      - libcjson
      - tedge-parameter-plugin
  apk:
    depends:
      - libmodbus
      - mosquitto-libs
      - cjson
      - tedge-parameter-plugin

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

contents:
  # The single native binary (also a standalone read/write CLI).
  - src: impl/c/dist/staged/tedge-dot
    dst: /usr/bin/tedge-dot
    file_info: { owner: root, group: root, mode: 0755 }

  # The service (running as tedge) persists management-command config changes
  # back into this directory, so it must be writable by tedge.
  - dst: /etc/tedge/plugins/ot
    type: dir
    file_info: { owner: tedge, group: tedge, mode: 0755 }

  # Default connector configs (no devices configured): the service starts and
  # stays active on a fresh install. Add [[device]] sections (or copy a demo
  # config from /usr/share/tedge-dot/demo/) and restart the service.
  - src: packaging/config/modbus.toml
    dst: /etc/tedge/plugins/ot/modbus.toml
    type: config|noreplace
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: packaging/config/opcua.toml
    dst: /etc/tedge/plugins/ot/opcua.toml
    type: config|noreplace
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: packaging/config/canbus.toml
    dst: /etc/tedge/plugins/ot/canbus.toml
    type: config|noreplace
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: packaging/config/canopen.toml
    dst: /etc/tedge/plugins/ot/canopen.toml
    type: config|noreplace
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  # PROFIBUS default is C-only (see impl/c/packaging/config/profibus.toml).
  - src: impl/c/packaging/config/profibus.toml
    dst: /etc/tedge/plugins/ot/profibus.toml
    type: config|noreplace
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  # Site-local point libraries (contract §3.4): the data point lists of the
  # device types this gateway talks to, referenced by `points_from` in a
  # connector config. Ships empty; a library dropped in here shadows a packaged
  # one of the same name. Writable by tedge for the same reason as the
  # directory above.
  - dst: /etc/tedge/plugins/ot/points.d
    type: dir
    file_info: { owner: tedge, group: tedge, mode: 0755 }

  # thin-edge.io flows: the device-side mapping between the connector's generic
  # OT envelopes and the thin-edge.io data model. The connector is a dumb driver,
  # so without these flows its samples, registrations and command results never
  # reach the cloud — the core pipeline therefore ships ACTIVE, in the c8y
  # mapper's flows directory (the mapper hot-reloads it, no restart needed).
  #
  # Only the flow logic is packaged (flow.toml, main.js) plus the documented
  # params.toml.template. The per-deployment settings live in a `params.toml`
  # the admin writes next to the template, which is never packaged — so an
  # upgrade replaces the logic and leaves the tuning untouched.
  - dst: /etc/tedge/mappers/c8y/flows
    type: dir
    file_info: { owner: tedge, group: tedge, mode: 0755 }
  - src: flows/ot-measurement/*
    dst: /etc/tedge/mappers/c8y/flows/ot-measurement/
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: flows/ot-registration/*
    dst: /etc/tedge/mappers/c8y/flows/ot-registration/
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: flows/ot-command-forward/*
    dst: /etc/tedge/mappers/c8y/flows/ot-command-forward/
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: flows/ot-command-result/*
    dst: /etc/tedge/mappers/c8y/flows/ot-command-result/
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: flows/ot-parameter-state/*
    dst: /etc/tedge/mappers/c8y/flows/ot-parameter-state/
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  # Alarms and events are declared per signal on the connector point (meta.alarm /
  # meta.event), so these do nothing until a point declares one — active as well.
  # Their measurement mode stays off until a params.toml names a series.
  - src: flows/ot-alarm/*
    dst: /etc/tedge/mappers/c8y/flows/ot-alarm/
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: flows/ot-event/*
    dst: /etc/tedge/mappers/c8y/flows/ot-event/
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  - src: flows/README.md
    dst: /usr/share/tedge-dot/flows/README.md
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  # Demo connector configs (one per OT protocol), paired with the simulators
  # in demo/docker-compose.yaml. Copy to /etc/tedge/plugins/ot/ to run them.
  - src: demo/config/modbus.toml
    dst: /usr/share/tedge-dot/demo/modbus.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/config/opcua.toml
    dst: /usr/share/tedge-dot/demo/opcua.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/config/canbus.toml
    dst: /usr/share/tedge-dot/demo/canbus.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/config/canopen.toml
    dst: /usr/share/tedge-dot/demo/canopen.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/config/profibus.toml
    dst: /usr/share/tedge-dot/demo/profibus.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  # DBC database describing the CAN signals the canbus simulator emits.
  - src: connectors/canbus/sim/test.dbc
    dst: /usr/share/tedge-dot/demo/can/test.dbc
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  # Simulator stack (pulls prebuilt images from GHCR).
  # Packaged point libraries (contract §3.4): the data point list of each demo
  # simulator, which is what the demo configs above reference instead of
  # inlining their points — so they must ship together or the demo cannot load.
  # They are also the quickest way to experiment with a device of your own:
  # point a `[[device]]` at your address and add `points_from = ["demo-sim"]`,
  # no point definitions to type. Keep in step with .goreleaser.yaml.
  - src: demo/points.d/modbus/demo-sim.toml
    dst: /usr/share/tedge-dot/points.d/modbus/demo-sim.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/points.d/opcua/demo-sim.toml
    dst: /usr/share/tedge-dot/points.d/opcua/demo-sim.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/points.d/canbus/demo-sim.toml
    dst: /usr/share/tedge-dot/points.d/canbus/demo-sim.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/points.d/canopen/demo-sim.toml
    dst: /usr/share/tedge-dot/points.d/canopen/demo-sim.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/points.d/profibus/demo-sim.toml
    dst: /usr/share/tedge-dot/points.d/profibus/demo-sim.toml
    file_info: { owner: tedge, group: tedge, mode: 0644 }
  - src: demo/points.d/README.md
    dst: /usr/share/tedge-dot/points.d/README.md
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  - src: demo/docker-compose.yaml
    dst: /usr/share/tedge-dot/demo/docker-compose.yaml
    file_info: { owner: tedge, group: tedge, mode: 0644 }

  # systemd unit: one process runs every config in /etc/tedge/plugins/ot.
  - src: packaging/tedge-dot.service
    dst: /lib/systemd/system/tedge-dot.service
    file_info: { owner: root, group: root, mode: 0644 }
