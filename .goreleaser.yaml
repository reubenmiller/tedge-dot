# goreleaser configuration for the Rust implementation of tedge-dot (impl/rust/).
# Docs: https://goreleaser.com
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# The C implementation (impl/c/) is packaged by impl/c/packaging/nfpm.yaml instead —
# goreleaser cross-compiles Rust/Go with zig and has no notion of a C build that also
# links system shared libraries. Both produce a package containing /usr/bin/tedge-dot:
# `tedge-dot-rs` here and `tedge-dot-c` there. The two are interchangeable and mutually
# exclusive; see the `provides`/`conflicts`/`replaces` block below.

version: 2

before:
  hooks:
    - rustup default stable
    # CI (release.yaml) pre-installs cargo-zigbuild via taiki-e/install-action
    # (a prebuilt binary, faster than building from source); `cargo install`
    # would fail there since the binary already exists at the destination.
    # Local `just build` has no such step, so still install it here if missing.
    - sh -c 'command -v cargo-zigbuild >/dev/null || cargo install --locked cargo-zigbuild'
    - cargo fetch --locked --manifest-path impl/rust/Cargo.toml

builds:
  - builder: rust
    # The cargo workspace lives in impl/rust/ (the C implementation is its sibling).
    # Only the build runs there: goreleaser itself, and every nfpms `contents.src`
    # below, stay relative to the repository root where the shared trees live.
    dir: impl/rust
    # `tedge-dot --version` reports the release version, not the workspace crate version
    # (impl/rust/src/main.rs). The C build gets the same string via cross/build.sh.
    env:
      - TEDGE_DOT_VERSION={{ .Version }}
    flags:
      - --release
      - --package=tedge-dot
      # Compile the cross-compilable protocol modules into the single binary so
      # one service can run modbus, opcua, canbus and canopen connectors.
      #
      # profibus is deliberately excluded: its serial dependency (serialport via
      # profirust) has a native libudev build script that does not cross-compile
      # with cargo-zigbuild. Build from source on Linux with
      # `cargo build --features profibus` to use it.
      - --features=modbus,opcua,canbus,canopen
    # The macOS targets link against Apple frameworks (IOKit, Security, CoreFoundation) that
    # only a macOS host's SDK provides, so release.yaml runs this build on a macOS runner; zig
    # still cross-compiles the Linux and Windows targets from there.
    targets:
      - x86_64-unknown-linux-gnu
      - x86_64-apple-darwin
      - x86_64-pc-windows-gnu
      - aarch64-unknown-linux-gnu
      - aarch64-apple-darwin

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    #
    # Named after the PACKAGE (tedge-dot-rs), not the project: a release carries the C
    # implementation's tarballs too, and `tedge-dot_Linux_x86_64.tar.gz` next to
    # `tedge-dot-c_0.1.0_linux_amd64.tar.gz` gives no clue which is which.
    name_template: >-
      tedge-dot-rs_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # goreleaser's defaults, which specifying `files` would otherwise replace.
      - LICENSE*
      - README*
      - CHANGELOG*
      # The device-side flows. An archive install is a manual one, so ship the
      # whole set (including the opt-in alarm/event flows) and let the operator
      # copy the ones they want into the mapper's flows directory — what the
      # deb/rpm/apk do for them. See flows/README.md.
      - src: flows/ot-*/
        dst: flows
      - src: flows/*.md
        dst: flows

nfpms:
  - id: linux
    # The two implementations ship the same /usr/bin/tedge-dot, the same systemd unit
    # and the same /etc/tedge/plugins/ot/ layout, so they are packaged under distinct
    # names and only one can be installed at a time. Both Provide the `tedge-dot`
    # virtual package and Conflict with it, which is what makes them mutually
    # exclusive: a conflict against a virtual package also conflicts with everything
    # else providing it. Replacing `tedge-dot` upgrades installs made before the split.
    package_name: tedge-dot-rs
    provides:
      - tedge-dot
    conflicts:
      - tedge-dot
      - tedge-dot-c
    replaces:
      - tedge-dot
    maintainer: thin-edge.io <info@thin-edge.io>
    description: "thin-edge.io OT protocol connectors (Modbus, OPC UA, CAN bus, CANopen) - Rust implementation"
    homepage: "https://github.com/thin-edge/tedge-dot"
    section: "default"
    priority: "extra"
    license: "Apache-2.0"
    formats:
      - deb
      - rpm
      - apk
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    contents:
      # The service (running as tedge) persists management-command config
      # changes back into this directory, so it must be writable by tedge.
      - dst: /etc/tedge/plugins/ot
        type: dir
        file_info: { owner: tedge, group: tedge, mode: 0755 }

      # Default connector configs (no devices configured): the service starts
      # and stays active on a fresh install. Add [[device]] sections (or copy a
      # demo config from /usr/share/tedge-dot/demo/) and restart the service.
      - src: packaging/config/modbus.toml
        dst: /etc/tedge/plugins/ot/modbus.toml
        type: config|noreplace
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: packaging/config/opcua.toml
        dst: /etc/tedge/plugins/ot/opcua.toml
        type: config|noreplace
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: packaging/config/canbus.toml
        dst: /etc/tedge/plugins/ot/canbus.toml
        type: config|noreplace
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: packaging/config/canopen.toml
        dst: /etc/tedge/plugins/ot/canopen.toml
        type: config|noreplace
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # Site-local point libraries (contract §3.4): the data point lists of the
      # device types this gateway talks to, referenced by `points_from` in a
      # connector config. Ships empty; a library dropped in here shadows a
      # packaged one of the same name. Writable by tedge for the same reason as
      # the directory above.
      - dst: /etc/tedge/plugins/ot/points.d
        type: dir
        file_info: { owner: tedge, group: tedge, mode: 0755 }

      # thin-edge.io flows: the device-side mapping between the connector's generic
      # OT envelopes and the thin-edge.io data model. The connector is a dumb driver,
      # so without these flows its samples, registrations and command results never
      # reach the cloud — the core pipeline therefore ships ACTIVE, in the c8y
      # mapper's flows directory (the mapper hot-reloads it, no restart needed).
      #
      # Only the flow logic is packaged (flow.toml, main.js) plus the documented
      # params.toml.template. The per-deployment settings live in a `params.toml`
      # the admin writes next to the template, which is never packaged — so an
      # upgrade replaces the logic and leaves the tuning untouched.
      - dst: /etc/tedge/mappers/c8y/flows
        type: dir
        file_info: { owner: tedge, group: tedge, mode: 0755 }
      - src: flows/ot-measurement/*
        dst: /etc/tedge/mappers/c8y/flows/ot-measurement/
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: flows/ot-registration/*
        dst: /etc/tedge/mappers/c8y/flows/ot-registration/
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: flows/ot-parameter-update/*
        dst: /etc/tedge/mappers/c8y/flows/ot-parameter-update/
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: flows/ot-parameter-result/*
        dst: /etc/tedge/mappers/c8y/flows/ot-parameter-result/
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: flows/ot-parameter-state/*
        dst: /etc/tedge/mappers/c8y/flows/ot-parameter-state/
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # Opt-in flows. Alarms and events are only meaningful once a threshold or an
      # event type has been chosen for a specific signal, so these ship inert: copy
      # the directory into /etc/tedge/mappers/c8y/flows/ and add a params.toml.
      - src: flows/ot-alarm/*
        dst: /usr/share/tedge-dot/flows/ot-alarm/
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: flows/ot-event/*
        dst: /usr/share/tedge-dot/flows/ot-event/
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: flows/README.md
        dst: /usr/share/tedge-dot/flows/README.md
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # Demo connector configs (one per OT protocol), paired with the simulators
      # in demo/docker-compose.yaml. Copy to /etc/tedge/plugins/ot/ to run
      # them (see demo/README.md).
      - src: demo/config/modbus.toml
        dst: /usr/share/tedge-dot/demo/modbus.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/config/opcua.toml
        dst: /usr/share/tedge-dot/demo/opcua.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/config/canbus.toml
        dst: /usr/share/tedge-dot/demo/canbus.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/config/canopen.toml
        dst: /usr/share/tedge-dot/demo/canopen.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # Packaged point libraries (contract §3.4): the data point list of each demo
      # simulator, which is what the demo configs above reference instead of
      # inlining their points. They are also the quickest way to experiment with
      # a device of your own — point a `[[device]]` at your address and add
      # `points_from = ["demo-sim"]`, no point definitions to type. A vendor's
      # device pack installs into this same
      # /usr/share/tedge-dot/points.d/<protocol>/ layout.
      - src: demo/points.d/modbus/demo-sim.toml
        dst: /usr/share/tedge-dot/points.d/modbus/demo-sim.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/points.d/opcua/demo-sim.toml
        dst: /usr/share/tedge-dot/points.d/opcua/demo-sim.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/points.d/canbus/demo-sim.toml
        dst: /usr/share/tedge-dot/points.d/canbus/demo-sim.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/points.d/canopen/demo-sim.toml
        dst: /usr/share/tedge-dot/points.d/canopen/demo-sim.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/points.d/profibus/demo-sim.toml
        dst: /usr/share/tedge-dot/points.d/profibus/demo-sim.toml
        file_info: { owner: tedge, group: tedge, mode: 0644 }
      - src: demo/points.d/README.md
        dst: /usr/share/tedge-dot/points.d/README.md
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # DBC database describing the CAN signals the canbus simulator emits.
      - src: connectors/canbus/sim/test.dbc
        dst: /usr/share/tedge-dot/demo/can/test.dbc
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # Simulator stack: pulls the prebuilt simulator images from GHCR
      # (published by .github/workflows/publish-simulators.yaml), so no
      # repository checkout is needed:
      #   docker compose -f /usr/share/tedge-dot/demo/docker-compose.yaml up -d
      - src: demo/docker-compose.yaml
        dst: /usr/share/tedge-dot/demo/docker-compose.yaml
        file_info: { owner: tedge, group: tedge, mode: 0644 }

      # SystemD Unit File
      - src: packaging/tedge-dot.service
        dst: /lib/systemd/system/tedge-dot.service
        file_info:
          mode: 0644
          owner: root

# Snapshot builds must carry the SAME version string as the C build's, or one `snapshot`
# pre-release ends up holding tedge-dot-rs and tedge-dot-c at what look like two different
# versions. The C side computes this in .github/workflows/release.yaml (`version` job); keep
# the two in step.
snapshot:
  version_template: "0.0.0-pre.{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

# The GitHub release is assembled by .github/workflows/release.yaml, not by goreleaser:
# it has to carry the C implementation's packages too, and a release can only be created
# once. goreleaser therefore only builds and packages (the workflow passes --skip=publish).
release:
  disable: true
