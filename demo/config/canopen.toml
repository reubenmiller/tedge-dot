# Demo CANopen connector config — pairs with the canopen-sim service in
# ../docker-compose.yaml (python-canopen SDO server, node ID 1 on vcan0).
#
# Ships with the tedge-dot package in /usr/share/tedge-dot/demo/. Copy it to
# /etc/tedge/plugins/ot/ and restart tedge-dot.service to run it against the
# simulator. Publishes to the thin-edge.io broker on 127.0.0.1:1883.
#
# Shares vcan0 with the canbus sim — CANopen SDO COB-IDs do not collide with the
# canbus ENGINE_STATUS frames (ID 0x1A0).

[connector]
protocol      = "canopen"
service_name  = "tedge-dot-canopen"
poll_interval = "1s"
log_level     = "info"

[mqtt]
host = "127.0.0.1"
port = 1883

[connection]
interface = "vcan0"

[[device]]
name             = "plc1"
protocol_address = { node_id = 1 }
points_from      = ["demo-sim"]

  # The points come from the packaged point library
  # points.d/canopen/demo-sim.toml (contract §3.4): the simulator's data point
  # list lives there, so this file holds only what is per-instance. An
  # installed package finds it automatically; from a source checkout point the
  # search path at the copy in this repo:
  #
  #   export TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d
  #
  # A device may still add points of its own, or adjust an inherited one by
  # naming its id and only the fields to change, e.g.:
  #
  #   [[device.point]]
  #   id   = "analog_in"
  #   name = "A label of my own"
