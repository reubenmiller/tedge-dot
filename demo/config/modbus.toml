# Demo Modbus connector config — pairs with the pymodbus simulator
# (modbus-sim in ../docker-compose.yaml, or `just sim modbus`), which maps the
# container's port 502 to host port 5020.
#
# Two ways to use it:
#
#   * Local exploration, no broker needed — the read/write CLI ignores [mqtt].
#     The points come from a packaged library, so from a checkout say where it is
#     once (an installed package needs none of this):
#
#       export TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d
#       cargo run --manifest-path impl/rust/Cargo.toml -- read  -c demo/config/modbus.toml                        # all readable points, once
#       cargo run --manifest-path impl/rust/Cargo.toml -- read  -c demo/config/modbus.toml -p 'temp_*' --poll     # keep polling (Ctrl-C stops)
#       cargo run --manifest-path impl/rust/Cargo.toml -- write -c demo/config/modbus.toml -d plc1 -p coil_rw --value true
#       cargo run --manifest-path impl/rust/Cargo.toml -- read  -c demo/config/modbus.toml -d plc1 -p bad_point   # exits 1 (bad quality)
#       cargo run --manifest-path impl/rust/Cargo.toml -- run   -c demo/config/modbus.toml --output stdout        # sample JSON lines on stdout
#
#   * Installed demo — ships with the tedge-dot package in /usr/share/tedge-dot/demo/.
#     Copy it to /etc/tedge/plugins/ot/ and restart tedge-dot.service to run it
#     against the simulator. Publishes to the thin-edge.io broker on 127.0.0.1:1883.
#     The library it references is installed alongside, so the copy just works.

[connector]
protocol      = "modbus"
service_name  = "tedge-dot-modbus"
poll_interval = "2s"
log_level     = "info"

[mqtt]
host = "127.0.0.1"
port = 1883

[connection.serial]
baudrate = 9600
parity   = "N"
stopbits = 2
databits = 8

[[device]]
name             = "plc1"
protocol_address = { transport = "tcp", host = "127.0.0.1", port = 5020, unit_id = 1 }
points_from      = ["demo-sim"]

  # The points come from the packaged point library
  # points.d/modbus/demo-sim.toml (contract §3.4): the simulator's data point
  # list lives there, so this file holds only what is per-instance. An
  # installed package finds it automatically; from a source checkout point the
  # search path at the copy in this repo:
  #
  #   export TEDGE_DOT_POINT_LIBRARY_PATH=demo/points.d
  #
  # A device may still add points of its own, or adjust an inherited one by
  # naming its id and only the fields to change, e.g.:
  #
  #   [[device.point]]
  #   id   = "temp_u16"
  #   name = "A label of my own"
